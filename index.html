<style>
/* Layout: banco del mercato, schede da toccare in griglia, quiz a schermo singolo con risposte grandi */
:root{
  --bg:#f2f6ee; --surface:#ffffff; --ink:#1e2a1b; --muted:#5b6955; --line:#dce5d3;
  --blue:#2a5fc9; --red:#e0412f; --gold:#f2b705;
  --good:#2b9450; --good-bg:#e3f5e8; --bad:#cf3535; --bad-bg:#fde6e4;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a13; --surface:#1e261c; --ink:#eef3ea; --muted:#a5b29e; --line:#2f3b2c;
  --blue:#6e9bff; --red:#ff6a55; --gold:#ffcb3d;
  --good:#52c47a; --good-bg:#1d3a25; --bad:#ff6f6f; --bad-bg:#45201f; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141a13; --surface:#1e261c; --ink:#eef3ea; --muted:#a5b29e; --line:#2f3b2c;
  --blue:#6e9bff; --red:#ff6a55; --gold:#ffcb3d;
  --good:#52c47a; --good-bg:#1d3a25; --bad:#ff6f6f; --bad-bg:#45201f; color-scheme:dark }
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.45}
.app{max-width:940px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,7vw,44px);line-height:1;margin:0;letter-spacing:-.01em}
.flag{display:flex;height:6px;width:84px;border-radius:3px;overflow:hidden;margin-top:6px}
.flag i{flex:1}.flag i:nth-child(1){background:var(--blue)}.flag i:nth-child(2){background:var(--line)}.flag i:nth-child(3){background:var(--red)}
.sub{color:var(--muted);font-size:14px;margin:6px 0 0}
.score{display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px 14px 6px 8px;font-weight:800;font-variant-numeric:tabular-nums}
.score svg{width:28px;height:28px}
.score b{font-family:var(--display);font-size:22px;min-width:1.2em;text-align:center}
.score span{font-size:14px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:5px}
.modes button{font:inherit;font-weight:800;border:0;border-radius:13px;padding:10px 6px;background:transparent;color:var(--muted);cursor:pointer;line-height:1.15}
.modes button small{display:block;font-weight:600;font-size:12px}
.modes button[aria-selected="true"]{background:var(--blue);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font:inherit;font-weight:700;font-size:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.chips button[aria-pressed="true"]{border-color:var(--red);color:var(--red)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hint{margin:0;color:var(--muted);font-size:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hint b{color:var(--ink);font-variant-numeric:tabular-nums}
h2{font-family:var(--display);font-weight:800;font-size:24px;margin:8px 0 0;display:flex;align-items:baseline;gap:8px}
h2 span{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 10px 10px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;position:relative}
.card.heard{border-color:var(--good)}
.pic{height:92px;display:grid;place-items:center}
.pic svg{width:86px;height:86px}
.emo{font-size:66px;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.fr{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.1;margin-top:4px}
.it{color:var(--muted);font-size:14px}
.spk{margin-top:8px;width:46px;height:46px;border-radius:50%;border:0;background:var(--blue);color:#fff;display:grid;place-items:center;cursor:pointer;transition:transform .15s}
.spk:active{transform:scale(.92)}
.spk svg,.bigspk svg{width:24px;height:24px}
.qtop{display:flex;justify-content:space-between;font-weight:800;color:var(--muted);font-size:14px}
.streak{color:var(--red)}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:5px;transition:width .3s}
.stage{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:8px}
.bigpic{height:170px;display:grid;place-items:center}
.bigpic svg{width:160px;height:160px}
.bigpic .emo{font-size:128px}
.ask{margin:0;font-weight:800;font-size:18px}
.bigspk{font:inherit;font-weight:800;display:flex;align-items:center;gap:10px;border:0;background:var(--blue);color:#fff;border-radius:999px;padding:16px 26px;cursor:pointer;font-size:18px}
.bigspk svg{width:34px;height:34px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{font:inherit;font-family:var(--display);font-weight:800;font-size:20px;min-height:66px;border:3px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:transform .12s}
.opt:not(:disabled):hover{border-color:var(--blue)}
.opt:not(:disabled):active{transform:scale(.97)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--good);background:var(--good-bg);animation:pop .35s}
.opt.no{border-color:var(--bad);background:var(--bad-bg);animation:shake .35s}
.pic-opt{min-height:130px}
.pic-opt svg{width:84px;height:84px}
.pic-opt .emo{font-size:66px}
.lab{font-size:15px}
.fb{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-radius:16px;padding:12px 14px;font-weight:800;font-size:18px}
.fb.good{background:var(--good-bg);color:var(--good)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.next,.btn{font:inherit;font-weight:800;border:0;border-radius:14px;padding:12px 20px;background:var(--red);color:#fff;cursor:pointer;font-size:16px}
.btn.alt{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.end{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:26px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.end h3{font-family:var(--display);font-weight:800;font-size:32px;margin:0;text-wrap:balance}
.stars{display:flex;gap:8px}
.stars svg{width:56px;height:56px}
.end .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.big{font-family:var(--display);font-size:28px;font-weight:800;color:var(--red)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;max-width:calc(100% - 32px);text-align:center}
@keyframes pop{50%{transform:scale(1.06)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<style>
*{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-tap-highlight-color:transparent}
img{max-width:100%}[hidden]{display:none!important}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Au marché&#8239;!</h1>
      <div class="flag" aria-hidden="true"><i></i><i></i><i></i></div>
      <p class="sub">Les aliments: légumes, fruits et fruits secs</p>
    </div>
    <div class="score" aria-live="polite"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.5 7L12 17.6 5.7 21.1l1.5-7L2 9.3l7-.8z" fill="var(--gold)"/></svg><span id="scoreLab">Ultimo voto</span><b id="pts">–</b></div>
  </header>

  <nav class="modes" role="tablist" aria-label="Modalità">
    <button role="tab" data-mode="learn" aria-selected="true">Impara<small>guarda e ascolta</small></button>
    <button role="tab" data-mode="quiz" aria-selected="false">Che cos'è?<small>dall'immagine</small></button>
    <button role="tab" data-mode="listen" aria-selected="false">Ascolta<small>e trova</small></button>
  </nav>

  <div class="chips" aria-label="Categoria">
    <button data-cat="all" aria-pressed="true">Tutti</button>
    <button data-cat="leg" aria-pressed="false">Les légumes</button>
    <button data-cat="fru" aria-pressed="false">Les fruits</button>
    <button data-cat="sec" aria-pressed="false">Les fruits secs</button>
  </div>

  <main id="view"></main>
</div>
<div id="toast" role="status" hidden></div>

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pool(){return cat==='all'?D:D.filter(d=>d.c===cat)}

function voto(ok,tot){return Math.round(ok/tot*10*2)/2}

const player=new Audio();player.preload='auto';
let frVoice=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();frVoice=v.find(x=>/^fr[-_]FR/i.test(x.lang))||v.find(x=>/^fr/i.test(x.lang))||null}catch(e){}}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speakTTS(t){
  if(!('speechSynthesis' in window)){toast('Audio non disponibile: controlla il volume del dispositivo');return}
  try{const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';if(frVoice)u.voice=frVoice;u.rate=.85;speechSynthesis.speak(u)}catch(e){}
}
function say(t){
  const src=AUD[t];
  if(!src){speakTTS(t);return}
  try{player.pause();player.src=src;player.currentTime=0;const p=player.play();if(p&&p.catch)p.catch(()=>speakTTS(t))}
  catch(e){speakTTS(t)}
}

/* Suonini per giusto e sbagliato */
let actx=null;
function beep(ok){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const notes=ok?[660,880]:[300,220];
    notes.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=f;
      const t=actx.currentTime+i*.12;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.15,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.18);
      o.connect(g).connect(actx.destination);o.start(t);o.stop(t+.2)});
  }catch(e){}
}

function renderLearn(){
  const cats=cat==='all'?['leg','fru','sec']:[cat];
  const total=pool().length, got=pool().filter(d=>heard.has(d.id)).length;
  view.innerHTML=`<p class="hint"><span>Tocca l'altoparlante per sentire la parola.</span><span>Ascoltate: <b>${got} su ${total}</b></span></p>`+
    cats.map(c=>{const items=D.filter(d=>d.c===c);
      return `<h2>${CAT[c]}<span>${items.length} parole</span></h2><div class="grid">${items.map(d=>`<article class="card${heard.has(d.id)?' heard':''}"><div class="pic">${art(d)}</div><div class="fr" lang="fr">${d.f}</div><div class="it">${d.i}</div><button class="spk" data-id="${d.id}" aria-label="Ascolta ${d.f}">${SPK}</button></article>`).join('')}</div>`}).join('');
  view.querySelectorAll('.spk').forEach(b=>b.onclick=()=>{
    const d=D[+b.dataset.id];say(d.f);
    if(!heard.has(d.id)){heard.add(d.id);b.closest('.card').classList.add('heard');
      const g=pool().filter(x=>heard.has(x.id)).length;view.querySelector('.hint b').textContent=`${g} su ${pool().length}`;
      if(g===pool().length)toast('Bravissimo! Hai ascoltato tutte le parole')}
  });
}

function startQuiz(){
  const qs=shuffle(pool().slice()).slice(0,Math.min(10,pool().length));
  Q={kind:mode,qs,n:0,ok:0,streak:0,locked:false};nextQ();
}
function options(a){let p=pool();if(p.length<4)p=D;return shuffle([a,...shuffle(p.filter(d=>d!==a)).slice(0,3)])}
function nextQ(){
  if(Q.n>=Q.qs.length)return endQuiz();
  const a=Q.qs[Q.n],opts=options(a);Q.cur={a,opts};Q.locked=false;
  const top=`<div class="qtop"><span>Domanda ${Q.n+1} di ${Q.qs.length}</span><span>Giuste: ${Q.ok}</span></div><div class="bar"><i style="width:${Q.n/Q.qs.length*100}%"></i></div>`;
  if(Q.kind==='quiz'){
    view.innerHTML=top+`<div class="stage"><div class="bigpic">${art(a)}</div><p class="ask">Come si dice in francese?</p></div><div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}" lang="fr">${o.f}</button>`).join('')}</div>`;
  }else{
    view.innerHTML=top+`<div class="stage"><button class="bigspk" id="replay">${SPK}<span>Ascolta</span></button><p class="ask">Quale cibo hai sentito?</p></div><div class="opts">${opts.map((o,k)=>`<button class="opt pic-opt" data-k="${k}" aria-label="Immagine ${k+1}">${art(o)}</button>`).join('')}</div>`;
    $('#replay').onclick=()=>say(a.f);say(a.f);
  }
  view.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
}
function answer(k){
  if(Q.locked)return;Q.locked=true;
  const {a,opts}=Q.cur,right=opts[k]===a,btns=view.querySelectorAll('.opt');
  btns.forEach((b,j)=>{if(opts[j]===a)b.classList.add('ok');else if(j===k)b.classList.add('no');b.disabled=true;
    if(Q.kind==='listen')b.insertAdjacentHTML('beforeend',`<span class="lab" lang="fr">${opts[j].f}</span>`)});
  let msg;
  if(right){Q.ok++;msg='Esatto!'}
  else{msg=`La risposta giusta è: ${a.f}`}
  say(a.f);beep(right);
  view.insertAdjacentHTML('beforeend',`<div class="fb ${right?'good':'bad'}"><span>${msg}</span><button class="next" id="next">${Q.n+1<Q.qs.length?'Avanti':'Vedi il risultato'}</button></div>`);
  const nx=$('#next');nx.onclick=()=>{Q.n++;nextQ()};nx.focus({preventScroll:true});
}
function endQuiz(){
  const tot=Q.qs.length,v=voto(Q.ok,tot),stars=v>=9?3:v>=7?2:v>=6?1:0;
  const key='bestv_'+Q.kind+'_'+cat,best=Math.max(+(store(key)||0),v);store(key,String(best));
  $('#pts').textContent=fmtVoto(v);
  const title=v>=9?'Ottimo!':v>=8?'Molto bene!':v>=7?'Bene!':v>=6?'Sufficiente, continua così!':'Ripassa le parole e riprova!';
  view.innerHTML=`<div class="end"><div class="stars">${[1,2,3].map(i=>STAR(i<=stars)).join('')}</div><h3>${title}</h3><p>Hai risposto bene a <b>${Q.ok}</b> domande su <b>${tot}</b>.</p><div class="big">Voto: ${fmtVoto(v)}</div><p class="sub">Miglior voto in questa modalità: ${fmtVoto(best)}</p><div class="row"><button class="btn" id="again">Gioca ancora</button><button class="btn alt" id="study">Ripassa le parole</button></div></div>`;
  if(stars>=2)beep(true);
  $('#again').onclick=startQuiz;$('#study').onclick=()=>setMode('learn');
}

function render(){mode==='learn'?renderLearn():startQuiz()}
function setMode(m){mode=m;document.querySelectorAll('.modes button').forEach(b=>b.setAttribute('aria-selected',b.dataset.mode===m));render()}
document.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
document.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;document.querySelectorAll('.chips button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});
render();
</script>

</body>
</html>
